name: TaskManager CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: projects/taskmanager-api/TaskManager.Api

      - name: Build application
        run: dotnet build --configuration Release
        working-directory: projects/taskmanager-api/TaskManager.Api
     
      - name: Build test project
        run: dotnet build --configuration Release
        working-directory: projects/taskmanager-api/TaskManager.Tests
     
      - name: Run unit tests
        run: dotnet test --no-build --configuration Release
        working-directory: projects/taskmanager-api/TaskManager.Tests

      - name: Build Docker image
        run: docker build -t ghcr.io/dhyperfox/taskmanager-api:latest .
        working-directory: projects/taskmanager-api/TaskManager.Api

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push ghcr.io/dhyperfox/taskmanager-api:latest
